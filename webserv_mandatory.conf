server {
	listen 8081;
	host 127.0.0.1;
	client_max_body_size 1M;
	status_directory ./www/error;
	error_page 404 ./www/error/404.html;
	error_page 500 ./www/error/500.html;

	location / {
		methods GET POST DELETE;
		root ./www;
		index index.html;
		autoindex off;
		upload_store ./www/posts;
	}

	location /old {
		methods GET;
		return 301 /;
	}

	location /listing {
		methods GET;
		root ./www/autoindex;
		autoindex on;
	}

	location /private {
		methods GET;
		root ./www/private;
		autoindex off;
	}

	location /cgi-bin {
		methods GET POST;
		root ./www/cgi-bin;
		cgi_extension .py /nix/store/jd20rkmqmkfkcvk2wl2lmzz7acq4svlr-python3-3.12.12/bin/python3;
	}
}
