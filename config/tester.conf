server {
	listen 8080;
	host 127.0.0.1;
	status_directory ./www/error;

	location / {
		methods GET;
		root ./www;
		index index.html;
	}

	location /post_body {
		methods POST;
		root ./www;
		upload_store ./www/posts;
		client_max_body_size 100;
	}

	location /directory {
		methods GET POST;
		root ./YoupiBanane;
		index youpi.bad_extension;
		cgi_extension .bla ./cgi_tester;
	}
}
